<?xml version="1.0"?>
<!-- MAME's speaker effects off (filter high-pass and low-pass, compressor, reverb, EQ):
     the audio a chip makes, for scripts/check_k539.py. Copied into a scratch
     -cfg_directory each run. -->
<mameconfig version="10">
    <system name="default">
        <mixer>
            <audio_effects>
                <effect step="1" type="Filters" highpass_active="0" lowpass_active="0" />
                <effect step="2" type="Compressor" mode="0" />
                <effect step="3" type="Reverb" mode="0" />
                <effect step="4" type="Equalizer" mode="0" />
            </audio_effects>
        </mixer>
    </system>
</mameconfig>
